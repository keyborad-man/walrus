<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111b1e" />
    <link rel="preload" href="/fonts/recursive-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Walrus — 饥荒联机版开服管理面板</title>
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem('walrus-theme')
          if (theme !== 'light') document.documentElement.classList.add('dark')
          var lang = localStorage.getItem('walrus-lang')
          if (lang) document.documentElement.lang = lang
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-primary/25 selection:text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
