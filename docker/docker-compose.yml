services:
  walrus:
    image: ghcr.io/keyborad-man/walrus:latest
    # 如需从本地源码自行构建，请注释掉上面的 image 并取消下方 build 注释：
    # build:
    #   context: ..
    #   dockerfile: docker/Dockerfile
    container_name: walrus
    restart: unless-stopped
    # On Linux, host networking avoids Docker UDP proxy overhead and lets you expand
    # the concurrent port pool without restarting the container.
    # For bridge mode instead, comment out `network_mode: host` and uncomment `ports`.
    network_mode: host
    # ports:
    #   - "8080:8080/tcp"
    #   - "10990-11060:10990-11060/udp"
    environment:
      WALRUS_ADDR: ":8080"
      WALRUS_DATA_DIR: "/data"
      WALRUS_RUNTIME: "linux"
      # 可选：默认 Steam Web API Key（可在面板「系统设置」中随时覆盖）
      # WALRUS_STEAM_API_KEY: ""
      # 可选：默认网络代理（用于创意工坊 Mod 查询/合集解析与 Klei 版本检测，SteamCMD 保持直连；可在「系统设置」随时开关或覆盖）
      # WALRUS_PROXY_URL: "http://127.0.0.1:7890"
      TZ: "Asia/Shanghai"
    volumes:
      - ./data:/data
      # 挂载宿主机 Docker Socket 以支持在面板「系统设置」内一键升级镜像；如不需要面板内升级可注释掉此行
      - /var/run/docker.sock:/var/run/docker.sock
